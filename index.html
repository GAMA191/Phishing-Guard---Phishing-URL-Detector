<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing Guard · URL detector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <header class="page-header">
      <h1>Phishing Guard <span>URL detector</span></h1>
      <p class="subhead">Quickly inspect suspicious links before you click.</p>
    </header>

    <section class="input-area" aria-label="URL scanning form">
      <label for="urlInput"><i aria-hidden="true">🔗</i> Enter URL to scan</label>
      <div class="url-input-wrapper">
        <input type="text" id="urlInput" placeholder="https://example.com/login" autocomplete="off" spellcheck="false">
        <button type="button" id="scanBtn">Scan</button>
      </div>

      <div class="examples" aria-label="Example URLs">
        <button type="button" class="example-chip" data-url="https://secure-paypal-login-account-now.com">PayPal</button>
        <button type="button" class="example-chip" data-url="https://www.google.com">Google</button>
        <button type="button" class="example-chip" data-url="https://bankofamerica-security-update-login.com">Bank</button>
      </div>
    </section>

    <section id="resultContainer" class="result-card" aria-live="polite" style="display: none;"></section>
    <div id="emptyState" class="empty-state">Enter a URL and press scan — results appear here</div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
